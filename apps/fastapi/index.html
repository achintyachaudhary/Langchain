<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Document Query</title>
  </head>
  <body>
    <h1>Document Query</h1>
    <form id="query-form">
      <label>
        Your query
        <textarea name="query" required></textarea>
      </label>
      <br />
      <button type="submit">Send query</button>
    </form>
    <p id="query-result" role="status"></p>

    <form id="upload-form">
      <label>
        PDF or DOCX document
        <input type="file" name="document" accept=".pdf,.docx" required />
      </label>
      <br />
      <label>
        Your query
        <textarea name="query" required></textarea>
      </label>
      <br />
      <button type="submit">Submit</button>
    </form>
    <p id="status" role="status"></p>
    <script>
      const queryForm = document.querySelector("#query-form");
      const queryResult = document.querySelector("#query-result");
      const form = document.querySelector("#upload-form");
      const status = document.querySelector("#status");

      queryForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        queryResult.textContent = "Sending query...";

        try {
          const response = await fetch("/query", {
            method: "POST",
            body: new FormData(queryForm),
          });
          const result = await response.json();
          queryResult.textContent = response.ok ? result.query : result.detail;
        } catch (error) {
          queryResult.textContent = "Could not reach the API.";
        }
      });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        status.textContent = "Submitting...";

        try {
          const response = await fetch("/upload", {
            method: "POST",
            body: new FormData(form),
          });
          const result = await response.json();
          status.textContent = response.ok ? result.message : result.detail;
        } catch (error) {
          status.textContent = "Could not reach the API.";
        }
      });
    </script>
  </body>
</html>
